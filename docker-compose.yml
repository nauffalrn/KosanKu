services:
  postgres:
    image: postgres:17-alpine
    container_name: kosanku-postgres
    environment:
      POSTGRES_USER: kosanku
      POSTGRES_PASSWORD: kosanku
      POSTGRES_DB: kosanku
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosanku -d kosanku"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
